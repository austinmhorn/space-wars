name: Build Space Wars

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.config.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Windows VS2022, os: windows-2022 }
          - { name: Linux GCC, os: ubuntu-latest }
          - { name: Linux Clang, os: ubuntu-latest, flags: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ }
          - { name: macOS Xcode, os: macos-latest }

        config:
          - { name: Shared, flags: -DBUILD_SHARED_LIBS=ON -DSFML_STATIC_LIBRARIES=OFF }
          - { name: Static, flags: -DBUILD_SHARED_LIBS=OFF -DSFML_STATIC_LIBRARIES=ON }

    steps:
      - name: Checkout Space Wars
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev \
            libxcursor-dev \
            libudev-dev \
            libopenal-dev \
            libflac-dev \
            libvorbis-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev

      - name: Checkout SFML 2.6.x
        uses: actions/checkout@v5
        with:
          repository: SFML/SFML
          ref: 2.6.x
          path: SFML
          fetch-depth: 0

      - name: Configure SFML
        shell: bash
        run: |
          cmake -S "$GITHUB_WORKSPACE/SFML" \
                -B "$GITHUB_WORKSPACE/SFML/build" \
                -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/SFML/install" \
                -DCMAKE_BUILD_TYPE=Release \
                ${{ matrix.platform.flags }} \
                ${{ matrix.config.flags }}

      - name: Build SFML
        shell: bash
        run: |
          cmake --build "$GITHUB_WORKSPACE/SFML/build" \
                --config Release \
                --target install

      - name: Configure Space Wars
        shell: bash
        run: |
          cmake -S "$GITHUB_WORKSPACE" \
                -B "$GITHUB_WORKSPACE/build" \
                -DCMAKE_BUILD_TYPE=Release \
                -DSFML_DIR="$GITHUB_WORKSPACE/SFML/install/lib/cmake/SFML" \
                ${{ matrix.platform.flags }} \
                ${{ matrix.config.flags }}

      - name: Build Space Wars
        shell: bash
        run: |
          cmake --build "$GITHUB_WORKSPACE/build" --config Release
